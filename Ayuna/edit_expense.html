<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать трату</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header" type="button" value="back" onclick="history.back()">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg>
        <div class="add_exp_title">Редактирование траты</div>
    </div>
    
    <div class="add_exp_container">
        <div class="input_field">
        <input type="text" placeholder="Название">
    </div>

    <div class="input_field">
        <input type="date">
    </div>

    <div class="input_field">
        <input type="number" placeholder="Сумма">
    </div>

    <div class="input_field">
        <input type="text" placeholder="Локация">
    </div>

    <div class="edit_exp_actions">
        <button class="save_btn">Сохранить</button>
        <button class="cancel_btn">Отмена</button>
    </div>
</body>
</html>
