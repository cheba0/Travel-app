<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Жильё — TravelMarket</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="market-header">
    <div class="categories">
        <a href="store.html"class="cat-item">✈︎ Билеты</a>
        <a href="tours.html" class="cat-item">⛱ Туры</a>
        <a href="hotel.html" class="cat-item active">🏠︎ Жильё</a>
    </div>
</div>

<main class="market-container">
    <div class="search-card">
        <div class="twin-fields">
            <div class="search-field">
                <label>Город / Район</label>
                <input type="text" placeholder="Москва">
            </div>
            <div class="search-field">
                <label>Гостей</label>
                <input type="text" placeholder="2 взрослых">
            </div>
        </div>
        <div class="twin-fields">
            <div class="search-field">
                <label>Заезд</label>
                <input type="date" class="date-input">
            </div>
            <div class="search-field">
                <label>Выезд</label>
                <input type="date" class="date-input">
            </div>
        </div>
        
        <button class="search-btn">🔍︎ Найти жильё</button>
    </div>

    <div class="results-header">
        <h3>Найденное жилье</h3>
        <span class="results-count">найдено 2</span>
    </div>

    <div class="hotels-list">
        <div class="hotel-card">
            <div class="hotel-image">🇹🇷</div>
            <div class="hotel-info">
                <div class="hotel-title">Sultanahmet Palace Hotel</div>
                <div class="hotel-location">⚲ Стамбул, район Султанахмет</div>
                <div class="hotel-rating">
                    <div class="stars">
                        <span class="star-filled">★</span>
                        <span class="star-filled">★</span>
                        <span class="star-filled">★</span>
                        <span class="star-filled">★</span>
                        <span class="star-filled">★</span>
                    </div>
                    <span class="rating-text">5,0 • 246 отзывов</span>
                </div>
                <div class="hotel-price-row">
                    <div>
                        <span class="hotel-price">12 990 <small>₽/ночь</small></span>
                    </div>
                    <button class="book-badge" style="border: none;">Забронировать</button>
                </div>
            </div>
        </div>


        <div class="hotel-card">
            <div class="hotel-image">🇦🇪</div>
            <div class="hotel-info">
                <div class="hotel-title">Atlantis The Palm</div>
                <div class="hotel-location">⚲ Дубай, Пальма Джумейра</div>
                <div class="hotel-rating">
                    <div class="stars">
                        <span class="star-filled">★</span>
                        <span class="star-filled">★</span>
                        <span class="star-filled">★</span>
                        <span class="star-filled">★</span>
                        <span class="star-filled">★</span>
                    </div>
                    <span class="rating-text">4,9 • 1 203 отзыва</span>
                </div>
                <div class="hotel-price-row">
                    <div>
                        <span class="hotel-price">28 990 <small>₽/ночь</small></span>
                    </div>
                    <button class="book-badge" style="border: none;">Забронировать</button>
                </div>
            </div>
        </div>

        
    </div>
</main>
